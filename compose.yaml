# Local dev: docker compose up --build
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: minibank
      POSTGRES_PASSWORD: local-only
      POSTGRES_DB: account
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U minibank -d account"]
      interval: 2s
      retries: 15

  account:
    build:
      context: .
      dockerfile: services/account/Dockerfile
    environment:
      PORT: "8080"
      DATABASE_URL: postgres://minibank:local-only@postgres:5432/account?sslmode=disable
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
