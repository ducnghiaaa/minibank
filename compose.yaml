# Local dev: docker compose up --build
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: minibank
      POSTGRES_PASSWORD: local-only
      POSTGRES_DB: account
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U minibank -d account"]
      interval: 2s
      retries: 15

  # one-shot, like the ArgoCD PreSync Job in the cluster
  account-migrate:
    build:
      context: .
      dockerfile: services/account/Dockerfile
    command: ["migrate"]
    environment:
      DATABASE_URL: postgres://minibank:local-only@postgres:5432/account?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy

  # fake Cognito: curl 'localhost:9000/token?sub=user-1&name=Nguyen+Van+An'
  devtoken:
    build:
      context: .
      dockerfile: cmd/devtoken/Dockerfile
    environment:
      ISSUER: http://localhost:9000
    ports:
      - "9000:9000"

  account:
    build:
      context: .
      dockerfile: services/account/Dockerfile
    environment:
      PORT: "8080"
      DATABASE_URL: postgres://minibank:local-only@postgres:5432/account?sslmode=disable
      AUTH_ISSUER: http://localhost:9000
      AUTH_JWKS_URL: http://devtoken:9000/.well-known/jwks.json
    ports:
      - "8080:8080"
    depends_on:
      account-migrate:
        condition: service_completed_successfully
      devtoken:
        condition: service_started

volumes:
  pgdata:
